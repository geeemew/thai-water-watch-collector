name: Check DDS canals around home
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read official DDS water table
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, os, re
          from html.parser import HTMLParser
          class Table(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.row=None; self.cell=None
              def handle_starttag(self,tag,attrs):
                  if tag=='tr': self.row=[]
                  if tag in ('td','th') and self.row is not None: self.cell=[]
              def handle_data(self,data):
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.cell is not None:
                      self.row.append(' '.join(''.join(self.cell).split())); self.cell=None
                  if tag=='tr' and self.row is not None: self.rows.append(self.row); self.row=None
          url='https://weather.bangkok.go.th/water'
          req=urllib.request.Request(url,headers={'User-Agent':'ThaiWaterWatchCollector/0.6.7 (+https://github.com/geeemew/thai-water-watch-collector)'})
          try:
              with urllib.request.urlopen(req,timeout=40) as r:
                  data=r.read(4000001)
                  if len(data)>4000000: raise RuntimeError('Response too large')
          except urllib.error.HTTPError as e:
              print('DDS HTTP',e.code,'No retry or bypass'); raise SystemExit(1)
          p=Table(); p.feed(data.decode('utf-8-sig',errors='replace'))
          ids={'WL.STN.01','WL.STN.02','WL.STN.03','WL.BKG.01'}
          headers=[r for r in p.rows if any('รหัสสถานี' in c for c in r)]
          if not headers or not any('ด้านใน' in c for c in headers[0]):
              raise SystemExit('Table schema not confirmed; no values accepted')
          found=[r for r in p.rows if r and r[0] in ids]
          if not found: raise SystemExit('Home canal stations not found')
          lines=['# DDS home canal check','Read from official page. No alerts or database writes.','Columns: '+' | '.join(headers[0])]
          for row in found:
              line=' | '.join(row); print(line); lines.append('- '+line)
          lines.append('Source: '+url)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write('\n\n'.join(lines))
          PY
